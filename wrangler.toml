# MSET — Language: JavaScript | Framework: Cloudflare Pages Functions (no extra framework)
# Database: Cloudflare D1 (binding DB) | Storage: Cloudflare R2 (binding FILES)
# Publish directory: frontend/ | Functions directory: functions/
# Logo local (frontend/assets/logo.svg) — R2-te upload hobe na.

name = "msettrust"
compatibility_date = "2024-12-01"

# --- D1 database binding ---
[[d1_databases]]
binding = "DB"
database_name = "msettrust-db"
database_id = "e7d5cace-6d40-4be7-8915-68511f5a1b5e"
migrations_dir = "migrations"

# --- R2 bucket binding ---
[[r2_buckets]]
binding = "FILES"
bucket_name = "msettrust-files"
